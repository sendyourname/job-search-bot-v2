name: Daily Job Search

on:
  schedule:
    # 8 AM EST = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore job database from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          name: jobs-db-latest
          workflow: daily-job-search.yml
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Send start notification
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          DB_INFO="Fresh run (no previous database)"
          if [ -f jobs.db ]; then
            DB_SIZE=$(du -h jobs.db | cut -f1)
            DB_INFO="Restored DB: $DB_SIZE"
          fi
          curl -s -F "token=$PUSHOVER_API_TOKEN" \
               -F "user=$PUSHOVER_USER_KEY" \
               -F "title=🔄 Job Search Starting" \
               -F "message=Daily job search bot is running. $DB_INFO" \
               -F "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -F "url_title=View Live Logs" \
               -F "priority=-1" \
               https://api.pushover.net/1/messages.json

      - name: Run job search bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -u -m src.main 2>&1 | tee bot_output.log

      - name: Upload job database (persistent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-latest
          path: jobs.db
          retention-days: 90
          overwrite: true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot_output.log
          retention-days: 30
